<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Opportunity — Opportunities.com</title>
<style>
  .cv-choice { display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border: 1px solid #dbe4ee; border-radius: 10px; cursor: pointer; font-weight: 600; }
  .cv-choice input { width: auto; margin: 0; }
  .cv-box { display: grid; gap: 8px; }
  .how { background: #f4f9ff; border: 1px solid #cfe3f7; border-radius: 10px; padding: 12px; }
  .how p { margin: 0 0 10px; }
  .where { font-weight: 600; color: #123b63; }
  .facts { margin: 6px 0; font-weight: 600; }
  .reqs { margin: 8px 0 14px; padding-left: 20px; }
</style>
<script src="app.js"></script>
</head>
<body>
<header id="top"></header>

<main>
  <a class="back" href="index.html" data-i18n="back"></a>
  <div id="detail" class="box"></div>
</main>

<script>
const WORK_LABEL = {
  onsite: "Onsite job",
  hybrid: "Hybrid (office and remote)",
  remote: "Remote job"
};

const EDU_LABEL = {
  any: "Any level",
  highschool: "High school",
  diploma: "Diploma / TVET",
  bachelor: "Bachelor's",
  master: "Master's",
  phd: "PhD"
};

document.addEventListener("DOMContentLoaded", load);

async function load() {
  const id = new URLSearchParams(location.search).get("id");
  const box = document.getElementById("detail");
  if (!/^\d+$/.test(id || "")) {
    box.innerHTML = '<p class="msg bad">' + t("notFound") + '</p>';
    return;
  }
  try {
    const data = await api("/opportunities/" + id);
    const o = data.item;
    const work = o.work_mode || "onsite";
    const reqs = (o.requirements || "").split("\n").map(function (s) { return s.trim(); }).filter(Boolean);

    let facts = '<p class="facts">🎓 ' + esc(EDU_LABEL[o.education_level || "any"] || "Any level") + '</p>';
    if (o.salary) facts += '<p class="facts">💰 ' + esc(o.salary) + '</p>';
    if (reqs.length) {
      facts += '<p><b>Requirements:</b></p><ul class="reqs">' +
        reqs.map(function (r) { return '<li>' + esc(r) + '</li>'; }).join("") + '</ul>';
    }

    box.innerHTML =
      '<span class="chip">' + esc(t(o.type)) + '</span>' +
      '<h2>' + esc(titleOf(o)) + '</h2>' +
      '<p class="org">' + esc(o.organization || "") + '</p>' +
      '<p class="where">' + esc(WORK_LABEL[work] || work) +
        (o.location ? ' · ' + esc(o.location) : '') + '</p>' +
      '<p class="muted">' + esc(o.country || "") + ' · ' + t("deadline") + ': ' + esc(o.deadline || "-") + '</p>' +
      facts +
      '<p>' + esc(o.description_en || "") + '</p>' +
      '<div id="applyArea"></div>';
    showApplyBlock(o);
  } catch (e) {
    box.innerHTML = '<p class="msg bad">' + esc(e.message) + '</p>';
  }
}

// Shown to visitors who are not logged in: log in first, then come back to this listing
function loginPrompt(id) {
  const next = encodeURIComponent("opportunity.html?id=" + id);
  return '<div class="how">' +
    '<p>Log in to apply for this opportunity.</p>' +
    '<a class="btn" href="auth.html?next=' + next + '">Login to apply</a>' +
    '<p class="muted" style="margin-top:12px">New here? ' +
      '<a href="auth.html?next=' + next + '">Create a free account</a>. ' +
      'You add your skills, education, and CV once, and you can use them for every listing.</p>' +
  '</div>';
}

function showApplyBlock(o) {
  const area = document.getElementById("applyArea");

  // Applicants go to the official website, but must log in first
  if (o.apply_method === "link") {
    if (!getToken()) {
      area.innerHTML = loginPrompt(o.id);
      return;
    }
    area.innerHTML =
      '<div class="how"><p>Please apply on the official website:</p>' +
      '<a class="btn" href="' + esc(o.apply_url) + '" target="_blank" rel="noopener">Apply on official website</a></div>';
    return;
  }

  // Applicants apply by email or in person, as the description explains
  if (o.apply_method === "inperson") {
    area.innerHTML =
      '<div class="how"><p>This employer asks applicants to apply by email or in person. ' +
      'Please follow the instructions in the description above.</p>' +
      (o.apply_url ? '<p><a href="' + esc(o.apply_url) + '" target="_blank" rel="noopener">Official link</a></p>' : '') +
      '</div>';
    return;
  }

  // Applicants apply through this site (sent to the hiring company)
  showApply(o.id);
}

async function showApply(id) {
  const area = document.getElementById("applyArea");

  // Logged-out visitors: log in, or create an account, then come back to this listing
  if (!getToken()) {
    area.innerHTML = loginPrompt(id);
    return;
  }

  area.innerHTML = '<p class="muted">Checking your CV...</p>';
  let cv = null;
  try {
    cv = (await api("/me/cv")).cv;
  } catch (e) {}

  if (!cv) {
    // After uploading, the CV page sends the applicant back to this listing
    const back = encodeURIComponent("opportunity.html?id=" + id);
    area.innerHTML = '<p class="msg bad">You need a CV to apply. <a href="cv.html?next=' + back + '">Upload CV</a></p>';
    return;
  }

  area.innerHTML =
    '<div class="cv-box">' +
      '<p class="muted">Your current CV: <strong id="cvName">' + esc(cv.filename) + '</strong></p>' +
      '<label class="cv-choice"><input type="radio" name="cvChoice" value="current" checked> Continue with current CV</label>' +
      '<label class="cv-choice"><input type="radio" name="cvChoice" value="new"> Update CV (upload a new one)</label>' +
      '<input id="newCv" type="file" accept=".pdf,.doc,.docx" hidden>' +
      '<p id="newCvName" class="muted" hidden></p>' +
    '</div>' +
    '<form id="applyForm" class="form">' +
      '<label>' + t("coverNote") + '</label>' +
      '<textarea id="note" rows="4"></textarea>' +
      '<button type="submit">' + t("submit") + '</button>' +
      '<p id="applyMsg" class="msg" hidden></p>' +
    '</form>';

  const newFile = document.getElementById("newCv");
  const newName = document.getElementById("newCvName");

  document.querySelectorAll('input[name="cvChoice"]').forEach(function (r) {
    r.addEventListener("change", function () {
      const isNew = document.querySelector('input[name="cvChoice"]:checked').value === "new";
      newFile.hidden = !isNew;
      newName.hidden = true;
      if (isNew) newFile.click();
    });
  });

  newFile.addEventListener("change", function () {
    if (newFile.files[0]) {
      newName.textContent = "New CV: " + newFile.files[0].name;
      newName.hidden = false;
    }
  });

  document.getElementById("applyForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    const m = document.getElementById("applyMsg");
    m.hidden = true;
    const choice = document.querySelector('input[name="cvChoice"]:checked').value;

    try {
      if (choice === "new") {
        const file = newFile.files[0];
        if (!file) throw new Error("Please choose your new CV file.");
        const ext = file.name.split(".").pop().toLowerCase();
        if (["pdf", "doc", "docx"].indexOf(ext) === -1) throw new Error("CV must be PDF, DOC or DOCX.");
        if (file.size > 2 * 1024 * 1024) throw new Error("CV must be 2 MB or smaller.");

        const fd = new FormData();
        fd.append("cv", file);
        const res = await fetch(API + "/me/cv", {
          method: "POST",
          headers: { Authorization: "Bearer " + getToken() },
          body: fd
        });
        const data = await res.json().catch(function () { return {}; });
        if (!res.ok) throw new Error(data.message || "CV upload failed.");
      }

      await api("/opportunities/" + id + "/apply", {
        method: "POST",
        body: JSON.stringify({ coverNote: document.getElementById("note").value })
      });
      m.textContent = t("applied");
      m.className = "msg ok";
      e.target.querySelector("button").disabled = true;
    } catch (err) {
      m.textContent = err.message;
      m.className = "msg bad";
    }
    m.hidden = false;
  });
}
</script>
</body>
</html>
