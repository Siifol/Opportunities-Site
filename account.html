<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My account — Opportunities.com</title>
<style>
  .acc-actions { display: flex; gap: 10px; flex-wrap: wrap; margin: 16px 0; }
  #logoutBtn { background: #8a1c1c; }
</style>
<script src="app.js"></script>
</head>
<body>
<header id="top"></header>

<main>
  <a class="back" href="index.html">← Back</a>
  <div class="box" id="acc"><p class="muted">Loading...</p></div>
</main>

<script>
document.addEventListener("DOMContentLoaded", async function () {
  const box = document.getElementById("acc");
  if (!getToken()) {
    location.href = "auth.html?next=account.html";
    return;
  }
  try {
    const me = (await api("/me")).user;
    const cv = (await api("/me/cv")).cv;
    box.innerHTML =
      '<h2>My account</h2>' +
      '<p><b>Name:</b> ' + esc(me.fullName) + '</p>' +
      '<p><b>Username:</b> ' + esc(me.username) + '</p>' +
      '<p><b>Country:</b> ' + esc(me.country || "-") + '</p>' +
      '<p><b>CV:</b> ' + (cv ? esc(cv.filename) : 'No CV uploaded yet') + '</p>' +
      '<div class="acc-actions">' +
        '<a class="btn" href="cv.html">Update CV</a>' +
        (me.role === "admin" ? '<a class="btn" href="admin.html">Admin</a>' : '') +
      '</div>' +
      '<button id="logoutBtn" type="button">Logout</button>';
    document.getElementById("logoutBtn").addEventListener("click", logout);
  } catch (err) {
    box.innerHTML =
      '<p class="msg bad">' + esc(err.message) + '</p>' +
      '<a class="btn" href="auth.html?next=account.html">Login</a>';
  }
});
</script>
</body>
</html>
