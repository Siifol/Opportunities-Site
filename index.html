<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Opportunities.com — Jobs & Scholarships</title>
<meta name="description" content="Verified jobs, scholarships and fellowships worldwide, starting with Ethiopia.">
<script src="app.js"></script>
</head>
<body>
<header id="top"></header>

<section class="hero">
  <div class="wrap">
    <h1 data-i18n="heroTitle"></h1>
    <p data-i18n="heroText"></p>
    <div class="search">
      <input id="q" data-i18n-ph="search" placeholder="">
      <button id="go" data-i18n="go"></button>
    </div>
  </div>
</section>

<main>
  <div class="tabs" id="tabs">
    <button data-type="" class="on" data-i18n="all"></button>
    <button data-type="job" data-i18n="job"></button>
    <button data-type="scholarship" data-i18n="scholarship"></button>
    <button data-type="other" data-i18n="other"></button>
  </div>
  <p id="status" class="muted"></p>
  <div id="list" class="grid"></div>
</main>

<script>
let TYPE = "";

document.addEventListener("DOMContentLoaded", function () {
  document.getElementById("go").addEventListener("click", load);
  document.getElementById("q").addEventListener("keydown", function (e) {
    if (e.key === "Enter") load();
  });
  document.querySelectorAll("#tabs button").forEach(function (b) {
    b.addEventListener("click", function () {
      TYPE = b.dataset.type;
      document.querySelectorAll("#tabs button").forEach(function (x) {
        x.classList.toggle("on", x === b);
      });
      load();
    });
  });
  load();
});

async function load() {
  const statusEl = document.getElementById("status");
  const list = document.getElementById("list");
  const params = new URLSearchParams();
  if (TYPE) params.set("type", TYPE);
  const q = document.getElementById("q").value.trim();
  if (q) params.set("q", q);
  statusEl.textContent = t("loading");
  list.innerHTML = "";
  try {
    const data = await api("/opportunities?" + params.toString());
    statusEl.textContent = data.items.length ? "" : t("none");
    list.innerHTML = data.items.map(card).join("");
  } catch (e) {
    statusEl.textContent = e.message;
  }
}

function card(o) {
  return '<article class="card">' +
    '<span class="chip">' + esc(t(o.type)) + '</span>' +
    '<h3>' + esc(titleOf(o)) + '</h3>' +
    '<p class="org">' + esc(o.organization || "") + '</p>' +
    '<p class="muted">' + esc(o.country || "") + ' · ' + t("deadline") + ': ' + esc(o.deadline || "-") + '</p>' +
    '<a class="btn" href="opportunity.html?id=' + o.id + '">' + t("viewDetails") + '</a>' +
    '</article>';
}
</script>
</body>
</html>
